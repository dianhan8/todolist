<form nz-form nzLayout="vertical" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    @for (column of columns; track $index) {
        @switch (column.type) {
            @case ('text') {
                <nz-form-item>
                    <nz-form-label>{{ column.title }}</nz-form-label>
                    <nz-form-control [nzErrorTip]="column.field + ' is required'">
                        <input nz-input formControlName="{{ column.field }}" placeholder="{{ column.field }}" />
                    </nz-form-control>
                </nz-form-item>
            }

            @case ('date'){
            <nz-form-item>
                <nz-form-label>{{ column.title }}</nz-form-label>
                <nz-form-control [nzErrorTip]="column.field + ' is required'">
                    <nz-date-picker formControlName="{{ column.field }}"></nz-date-picker>
                </nz-form-control>
            </nz-form-item>
            }

            @case ('select'){
            <nz-form-item>
                <nz-form-label>{{ column.title }}</nz-form-label>
                <nz-form-control [nzErrorTip]="column.field + ' is required'">
                    <nz-select formControlName="{{ column.field }}" nzPlaceHolder="Select {{ column.title }}" nzAllowClear>
                        <nz-option *ngFor="let option of column.options" [nzValue]="option.label | async" [nzLabel]="option.label | async"></nz-option>
                    </nz-select>
                </nz-form-control>
            </nz-form-item>
            }
            @case ('person') {
            <nz-form-item>
                <nz-form-label>{{ column.title }}</nz-form-label>
                <nz-form-control [nzErrorTip]="column.field + ' is required'">
                    <nz-select formControlName="{{ column.field }}" nzMode="multiple" nzPlaceHolder="Select People" nzAllowClear>
                        <nz-option *ngFor="let person of column.options" [nzValue]="person" [nzLabel]="person"></nz-option>
                    </nz-select>
                </nz-form-control>
            </nz-form-item>
            }
            @default {
            <nz-form-item>
                <nz-form-label>{{ column.title }}</nz-form-label>
                <nz-form-control [nzErrorTip]="column.field + ' is required'">
                    <input nz-input formControlName="{{ column.field }}" />
                </nz-form-control>
            </nz-form-item>
            }
        }
    }

    <nz-form-item style="margin-top: 18px;">
        <button nz-button nzType="primary" type="submit">Submit</button>
    </nz-form-item>
</form>
